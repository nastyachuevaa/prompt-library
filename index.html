<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prompt Studio</title>
    <link rel="stylesheet" href="styles.css?v=gallery-13" />
  </head>
  <body>
    <main class="studio-shell" aria-label="Prompt Studio">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">PS</span>
          <div>
            <p class="eyebrow">Draft</p>
            <h1>Prompt Studio</h1>
          </div>
        </div>

        <nav class="task-tabs" id="taskTabs" aria-label="Основные задачи"></nav>
      </header>

      <section class="workspace">
        <section class="results-panel" aria-labelledby="resultsTitle">
          <div class="results-header">
            <div>
              <p class="eyebrow">Output</p>
              <h2 id="resultsTitle">Images</h2>
            </div>
            <div class="gallery-tools">
              <label class="gallery-scale" for="gallerySize">
                <span>Размер</span>
                <input id="gallerySize" type="range" min="160" max="420" step="10" value="260" aria-label="Размер изображений в галерее" />
              </label>
              <div class="selection-toolbar" id="selectionToolbar" hidden>
                <span id="selectionCount">Выбрано: 0</span>
                <button class="delete-selected-button" type="button" id="deleteSelectedButton">Удалить выбранные</button>
              </div>
            </div>
          </div>
          <div class="results-grid" id="resultsGrid"></div>
        </section>

        <section class="composer" aria-label="Параметры генерации">
          <section class="brief-panel" aria-labelledby="taskTitle">
            <div class="visually-hidden">
              <div>
                <p class="eyebrow" id="taskModelLabel">Nano Banana</p>
                <h2 id="taskTitle">NB Appearance Options</h2>
              </div>
            </div>

            <form class="brief-form" id="briefForm"></form>
          </section>

          <aside class="settings-panel" aria-labelledby="settingsTitle">
            <h2 id="settingsTitle" class="visually-hidden">Generate</h2>
            <p class="status-text" id="statusText" aria-live="polite"></p>

            <div class="settings-stack compact-controls">
              <label class="field toolbar-control model-control">
                <span class="visually-hidden">Model</span>
                <select id="modelSelect" aria-label="Model"></select>
              </label>

              <label class="field toolbar-control">
                <span class="visually-hidden">Формат</span>
                <select id="aspectSelect" aria-label="Формат кадра"></select>
              </label>
              <label class="field toolbar-control">
                <span class="visually-hidden">Качество</span>
                <select id="resolutionSelect" aria-label="Качество изображения"></select>
              </label>
              <label class="field toolbar-control count-field">
                <span class="visually-hidden">Images</span>
                <input id="countInput" type="number" min="1" max="4" value="2" aria-label="Количество изображений" />
              </label>
            </div>

            <section class="reference-box" aria-labelledby="referenceTitle">
              <label class="upload-zone" id="referenceTitle" for="referenceInput">
                <input id="referenceInput" type="file" accept="image/*" multiple />
                <span>Добавить референсы</span>
              </label>
              <div class="reference-list" id="referenceList"></div>
            </section>

            <button class="primary-button generate-button" type="button" id="generateButton">Generate</button>
          </aside>
        </section>
      </section>
    </main>

    <script src="app.js?v=gallery-13" defer></script>
  </body>
</html>
