<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Библиотека промптов</title>
    <link rel="stylesheet" href="styles.css?v=image-gen-1" />
  </head>
  <body>
    <main class="app-shell" aria-label="Библиотека промптов">
      <aside class="topics-panel" aria-label="Темы промптов">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">P</span>
          <div>
            <p class="eyebrow">Моя библиотека</p>
            <h1>Промпты</h1>
          </div>
        </div>

        <nav class="topic-list" id="topicList" aria-label="Список тем"></nav>
      </aside>

      <section class="builder-panel" aria-labelledby="builderTitle">
        <div class="builder-heading">
          <div>
            <p class="eyebrow" id="builderCategory">Изображения</p>
            <h2 id="builderTitle">NB Appearance Options</h2>
          </div>
          <button class="ghost-button" type="button" id="resetButton">Сбросить</button>
        </div>

        <form class="prompt-form" id="promptForm"></form>
      </section>

      <section class="result-panel" aria-labelledby="resultTitle">
        <section class="refs-section" id="refsSection" aria-labelledby="refsTitle">
          <div class="refs-header">
            <h2 id="refsTitle">Рефы</h2>
          </div>
          <div class="refs-grid" id="refsGrid"></div>
        </section>

        <div class="result-block">
          <div class="result-header">
            <h2 id="resultTitle">Готовый промпт</h2>
            <button class="ghost-button" type="button" id="copyButton">
              Копировать
            </button>
          </div>
          <textarea id="promptOutput" readonly aria-label="Готовый промпт"></textarea>
          <div class="prompt-cards" id="promptCards" hidden></div>
          <div class="result-actions">
            <p class="status-text" id="statusText" aria-live="polite"></p>
          </div>
        </div>

        <section class="image-generator" aria-labelledby="imageGeneratorTitle">
          <div class="image-generator-header">
            <h2 id="imageGeneratorTitle">Генерация изображения</h2>
            <button class="primary-button" type="button" id="imageGenerateButton">
              Сгенерировать
            </button>
          </div>

          <div class="image-controls">
            <label class="field">
              <span>Модель</span>
              <select id="imageProviderSelect" aria-label="Модель генерации">
                <option value="auto">Авто</option>
                <option value="nano-banana">Nano Banana</option>
                <option value="seedream">SeeDream</option>
              </select>
            </label>
            <label class="field">
              <span>Формат</span>
              <select id="imageAspectSelect" aria-label="Формат изображения">
                <option value="1:1">1:1</option>
                <option value="4:5">4:5</option>
                <option value="3:4">3:4</option>
                <option value="9:16">9:16</option>
                <option value="16:9">16:9</option>
              </select>
            </label>
            <label class="field">
              <span>Размер</span>
              <select id="imageResolutionSelect" aria-label="Размер изображения">
                <option value="1K">1K</option>
                <option value="2K">2K</option>
                <option value="4K">4K</option>
              </select>
            </label>
            <label class="field">
              <span>Штук</span>
              <input
                id="imageCountInput"
                type="number"
                min="1"
                max="4"
                value="1"
                aria-label="Количество изображений"
              />
            </label>
          </div>

          <p class="image-hint" id="imageHint"></p>
          <div class="image-results" id="imageResults"></div>
        </section>
      </section>
    </main>

    <script src="app.js?v=image-gen-1" defer></script>
  </body>
</html>
